name: Build & Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Verify Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teqniqks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: teqniqks/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify build artifacts
        working-directory: .
        shell: bash
        run: |
          test -f docs/index.html
          test -f docs/CNAME
          test -f docs/.nojekyll
