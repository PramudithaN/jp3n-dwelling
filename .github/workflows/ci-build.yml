name: Build & Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Verify Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --no-script --check

      - name: Test repo scripts
        run: bun test scripts/commitlint.test.ts scripts/sync-team-calendar.test.ts

      - name: Build production site
        env:
          CALENDAR_READ_TOKEN: ${{ secrets.CALENDAR_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_OFFLINE_CALENDAR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: bun run build

      - name: Verify build artifacts
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/CNAME
