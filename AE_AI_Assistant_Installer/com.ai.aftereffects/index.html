<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        :root {
            --ae-bg: #222222;
            --ae-panel: #262626;
            --ae-panel-elevated: #2d2d2d;
            --ae-input-bg: #181818;
            --ae-input-border: #3b3b3b;
            --ae-input-focus: #1473e6;
            --ae-text-primary: #d5d5d5;
            --ae-text-secondary: #909090;
            --ae-text-disabled: #555555;
            --ae-border: #333333;
            --ae-button-bg: #323232;
            --ae-button-hover: #3e3e3e;
            --ae-button-active: #1f1f1f;
            --ae-blue: #1473e6;
            --ae-blue-hover: #0d66d0;
            --ae-blue-active: #0952a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Adobe Clean", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 11px;
            letter-spacing: 0.1px;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--ae-bg);
            color: var(--ae-text-primary);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100vh;
            overflow-y: auto;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--ae-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #eeeeee;
        }

        .author-tag {
            font-size: 9px;
            color: var(--ae-text-secondary);
            font-weight: 400;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--ae-text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 12px;
            line-height: 1;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: var(--ae-button-hover);
        }

        /* Segmented Provider Switcher */
        .segmented-control {
            display: flex;
            background: #191919;
            border: 1px solid var(--ae-border);
            border-radius: 3px;
            padding: 2px;
            gap: 2px;
        }

        .segment-btn {
            flex: 1;
            padding: 4px 6px;
            background: transparent;
            border: none;
            color: var(--ae-text-secondary);
            cursor: pointer;
            border-radius: 2px;
            font-size: 10px;
            font-weight: 500;
            text-align: center;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .segment-btn.active {
            background: #383838;
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .segment-btn:hover:not(.active) {
            color: var(--ae-text-primary);
        }

        /* Section Layout */
        .section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9.5px;
            font-weight: 600;
            color: var(--ae-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .status-badge {
            font-size: 9.5px;
            font-weight: 500;
            text-transform: none;
        }

        .status-active {
            color: #49c279;
        }

        .status-empty {
            color: #e57373;
        }

        /* Standard Controls */
        input[type="text"], input[type="password"], textarea, select {
            background-color: var(--ae-input-bg);
            border: 1px solid var(--ae-input-border);
            color: var(--ae-text-primary);
            padding: 5px 7px;
            border-radius: 2px;
            outline: none;
            width: 100%;
            user-select: text;
            -webkit-user-select: text;
        }

        input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
            border-color: var(--ae-input-focus);
        }

        select {
            cursor: pointer;
            padding: 4px 6px;
        }

        textarea {
            resize: vertical;
            line-height: 1.4;
            min-height: 60px;
        }

        .input-row {
            display: flex;
            gap: 4px;
        }

        .info-card {
            background: #191919;
            border: 1px solid var(--ae-border);
            border-radius: 2px;
            padding: 6px 8px;
            color: #888888;
            font-size: 10px;
            line-height: 1.4;
        }

        /* Adobe Buttons */
        .btn {
            background: var(--ae-button-bg);
            border: 1px solid #3c3c3c;
            color: var(--ae-text-primary);
            padding: 5px 10px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 500;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            transition: background 0.1s ease;
        }

        .btn:hover {
            background: var(--ae-button-hover);
            color: #ffffff;
        }

        .btn:active {
            background: var(--ae-button-active);
        }

        .btn-primary {
            background: var(--ae-blue);
            border-color: #1260c2;
            color: #ffffff;
            font-weight: 600;
            padding: 7px 10px;
        }

        .btn-primary:hover {
            background: var(--ae-blue-hover);
        }

        .btn-primary:active {
            background: var(--ae-blue-active);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        /* Log / Script Output Box */
        .log-box {
            background: #161616;
            border: 1px solid var(--ae-border);
            border-radius: 2px;
            padding: 6px 8px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 10.5px;
            line-height: 1.35;
            color: #a0a0a0;
            min-height: 65px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        .log-box.error {
            color: #e57373;
        }

        .log-box.success {
            color: #49c279;
        }

        .footer {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid #2b2b2b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            color: #666666;
        }
    </style>
</head>
<body>

    <!-- Header bar -->
    <div class="top-bar">
        <div class="brand">
            <span class="brand-title">Motion Engine</span>
            <span class="author-tag">by Pramuditha</span>
        </div>
        <button class="icon-btn" onclick="location.reload()" title="Reload Panel">↻</button>
    </div>

    <!-- Provider Selection -->
    <div class="segmented-control">
        <button id="tabAntigravity" class="segment-btn active" onclick="switchProvider('antigravity')">Antigravity</button>
        <button id="tabGemini" class="segment-btn" onclick="switchProvider('gemini')">Gemini</button>
        <button id="tabClaude" class="segment-btn" onclick="switchProvider('claude')">Claude</button>
    </div>

    <!-- Dynamic Config Section -->
    <div class="section" id="configSection">
        <!-- Injected via JavaScript based on active provider -->
    </div>

    <!-- Main Instruction Area -->
    <div class="section">
        <div class="section-label">
            <span>Edit / Animation Command</span>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; text-transform: none; font-size: 10px; color: #49c279;">
                <input type="checkbox" id="visionMode" checked style="cursor: pointer; width: auto;">
                <span>Vision Mode (Frame Analysis)</span>
            </label>
        </div>
        <textarea id="aiPrompt" rows="3" placeholder="e.g. Detect text in this gif and add a subtract mask around it to remove it..."></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="askAI()">Execute Command</button>
    </div>

    <!-- Quick Utilities -->
    <div class="section">
        <div class="section-label">
            <span>Preset Actions</span>
        </div>
        <div class="btn-grid">
            <button class="btn" onclick="createTitle()">New Title Comp</button>
            <button class="btn" onclick="addWiggle()">Add Wiggle (3, 30)</button>
        </div>
    </div>

    <!-- Output / Status -->
    <div class="section">
        <div class="section-label">
            <span>Script Engine Log</span>
        </div>
        <div id="outputLog" class="log-box">Ready.</div>
    </div>

    <div class="footer">
        <span>ExtendScript Engine 2026</span>
        <span>Pramuditha Motion Tools</span>
    </div>

    <script src="js/CSInterface.js"></script>
    <script>
        const cs = new CSInterface();
        const logEl = document.getElementById('outputLog');
        const sendBtn = document.getElementById('sendBtn');
        const configSection = document.getElementById('configSection');
        const tabAntigravity = document.getElementById('tabAntigravity');
        const tabGemini = document.getElementById('tabGemini');
        const tabClaude = document.getElementById('tabClaude');

        let currentProvider = localStorage.getItem('ae_active_provider') || 'antigravity';

        const SYSTEM_INSTRUCTION = `You are an elite Adobe After Effects ExtendScript developer.
The user wants to perform an animation, motion graphic, or editing task in After Effects.
Generate executable ExtendScript (ECMAScript 3 compliant) code that runs directly inside After Effects.

Rules:
1. Output ONLY executable JavaScript/ExtendScript code inside a self-invoking function (function() { ... })();
2. Do NOT include markdown formatting or prose - output RAW code only.
3. Always wrap your work in app.beginUndoGroup("AI Action") and app.endUndoGroup().
4. If working with active composition, check: var comp = app.project.activeItem; if (!(comp instanceof CompItem)) { return "ERROR: No active composition found."; }
5. If creating a new composition or layers, ensure app.project exists (if (!app.project) app.newProject()).
6. Always return a string message at the end stating what was completed (e.g., return "SUCCESS: Created animation!").
7. Wrap in try { ... } catch(e) { return "ERROR: " + e.toString(); }`;

        window.addEventListener('DOMContentLoaded', () => {
            switchProvider(currentProvider, false);
        });

        function switchProvider(provider, save = true) {
            currentProvider = provider;
            if (save) localStorage.setItem('ae_active_provider', provider);

            tabAntigravity.className = 'segment-btn' + (provider === 'antigravity' ? ' active' : '');
            tabGemini.className = 'segment-btn' + (provider === 'gemini' ? ' active' : '');
            tabClaude.className = 'segment-btn' + (provider === 'claude' ? ' active' : '');

            if (provider === 'antigravity') {
                sendBtn.textContent = 'Send to Antigravity';
                configSection.innerHTML = `
                    <div class="section-label">
                        <span>Antigravity Local Bridge</span>
                        <span id="bridgeStatus" class="status-badge status-active">Active (127.0.0.1:4000)</span>
                    </div>
                    <div class="info-card">
                        Zero API keys required. Connected directly to your local Antigravity AI session (powered by Google AI Pro).
                    </div>
                `;
                checkBridgeConnection();

            } else if (provider === 'claude') {
                sendBtn.textContent = 'Execute with Claude';
                const savedKey = localStorage.getItem('claude_ae_key') || '';
                configSection.innerHTML = `
                    <div class="section-label">
                        <span>Claude API Key</span>
                        <span id="keyStatus" class="status-badge ${savedKey ? 'status-active' : 'status-empty'}">${savedKey ? 'Active' : 'Not configured'}</span>
                    </div>
                    <div class="input-row">
                        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${savedKey}">
                        <button class="btn" onclick="saveApiKey()">Save</button>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
                        <span class="section-label" style="font-size: 9px;">Target Model</span>
                        <select id="modelSelect" style="max-width: 170px;">
                            <option value="claude-3-7-sonnet-20250219" selected>Claude 3.7 Sonnet</option>
                            <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                            <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
                        </select>
                    </div>
                `;

            } else { // Gemini
                sendBtn.textContent = 'Execute with Gemini';
                const savedKey = localStorage.getItem('gemini_ae_key') || '';
                configSection.innerHTML = `
                    <div class="section-label">
                        <span>Gemini API Key</span>
                        <span id="keyStatus" class="status-badge ${savedKey ? 'status-active' : 'status-empty'}">${savedKey ? 'Active' : 'Not configured'}</span>
                    </div>
                    <div class="input-row">
                        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." value="${savedKey}">
                        <button class="btn" onclick="saveApiKey()">Save</button>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
                        <span class="section-label" style="font-size: 9px;">Target Model</span>
                        <select id="modelSelect" style="max-width: 170px;">
                            <option value="gemini-3.8-flash">Loading models...</option>
                        </select>
                    </div>
                `;
                if (savedKey) loadGeminiModels(savedKey);
            }
        }

        async function checkBridgeConnection() {
            try {
                const res = await fetch('http://127.0.0.1:4000/status');
                const statusEl = document.getElementById('bridgeStatus');
                if (res.ok && statusEl) {
                    statusEl.textContent = 'Active (127.0.0.1:4000)';
                    statusEl.className = 'status-badge status-active';
                }
            } catch (e) {
                const statusEl = document.getElementById('bridgeStatus');
                if (statusEl) {
                    statusEl.textContent = 'Offline (Start server)';
                    statusEl.className = 'status-badge status-empty';
                }
            }
        }

        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            if (!input) return;
            const key = input.value.trim();
            const storageName = currentProvider === 'claude' ? 'claude_ae_key' : 'gemini_ae_key';
            const statusEl = document.getElementById('keyStatus');

            if (!key) {
                localStorage.removeItem(storageName);
                if (statusEl) {
                    statusEl.textContent = 'Not configured';
                    statusEl.className = 'status-badge status-empty';
                }
                log(`${currentProvider.toUpperCase()} key removed.`);
                return;
            }

            localStorage.setItem(storageName, key);
            if (statusEl) {
                statusEl.textContent = 'Active';
                statusEl.className = 'status-badge status-active';
            }
            log(`${currentProvider.toUpperCase()} key saved.`, 'success');

            if (currentProvider === 'gemini') loadGeminiModels(key);
        }

        async function loadGeminiModels(key) {
            try {
                const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key));
                if (!res.ok) return;
                const data = await res.json();
                const validModels = (data.models || [])
                    .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                    .map(m => m.name.replace(/^models\//, ''));

                const select = document.getElementById('modelSelect');
                if (validModels.length > 0 && select) {
                    select.innerHTML = '';
                    validModels.sort((a, b) => b.localeCompare(a));
                    validModels.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m;
                        if (m.includes('3.8-flash') || m.includes('2.0-flash')) opt.selected = true;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.warn(e);
            }
        }

        function log(msg, type) {
            logEl.textContent = msg;
            logEl.className = 'log-box ' + (type || '');
        }

        function captureSnapshotData() {
            return new Promise((resolve) => {
                cs.evalScript('captureCurrentFrame()', function(res) {
                    if (!res || res.indexOf('ERROR') === 0) {
                        resolve(null);
                        return;
                    }
                    try {
                        const info = JSON.parse(res);
                        let base64 = null;
                        if (window.cep && window.cep.fs) {
                            const result = window.cep.fs.readFile(info.path, window.cep.encoding.Base64);
                            if (result.err === 0 && result.data) base64 = result.data;
                        }
                        if (!base64 && typeof require !== 'undefined') {
                            try {
                                const fs = require('fs');
                                base64 = fs.readFileSync(info.path, 'base64');
                            } catch (e) {}
                        }
                        if (base64) {
                            resolve({ base64: base64, path: info.path, width: info.width, height: info.height });
                        } else {
                            resolve(null);
                        }
                    } catch (e) {
                        resolve(null);
                    }
                });
            });
        }

        async function askAI() {
            const isVision = document.getElementById('visionMode').checked;
            let snapshot = null;
            if (isVision) {
                log('Analyzing current composition frame with Vision...');
                snapshot = await captureSnapshotData();
                if (snapshot) {
                    log(`Frame captured (${snapshot.width}x${snapshot.height}). Vision analyzing pixels...`);
                }
            }

            if (currentProvider === 'antigravity') {
                await callAntigravityBridge(snapshot);
            } else if (currentProvider === 'claude') {
                await callClaude(snapshot);
            } else {
                await callGemini(snapshot);
            }
        }

        // ==================== ANTIGRAVITY LOCAL BRIDGE ====================
        async function callAntigravityBridge(snapshot) {
            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) {
                log('Please enter a command or prompt.', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Sent to Antigravity...';
            log('Sending request to local Antigravity Bridge (http://127.0.0.1:4000)...');

            try {
                const payload = {
                    prompt: prompt,
                    vision: !!snapshot,
                    compWidth: snapshot ? snapshot.width : 1920,
                    compHeight: snapshot ? snapshot.height : 1080,
                    snapshotPath: snapshot ? snapshot.path : null,
                    timestamp: Date.now()
                };

                const response = await fetch('http://127.0.0.1:4000/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('Bridge server error: ' + response.statusText);
                }

                const result = await response.json();
                if (result.code) {
                    log('Received code from Antigravity. Executing in After Effects...');
                    cs.evalScript('evalCustomScript(' + JSON.stringify(result.code) + ')', function(res) {
                        sendBtn.disabled = false;
                        sendBtn.textContent = 'Send to Antigravity';
                        log(res, res && res.indexOf('ERROR') === 0 ? 'error' : 'success');
                    });
                } else if (result.message) {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send to Antigravity';
                    log(result.message, 'success');
                }

            } catch (err) {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send to Antigravity';
                log('Bridge Notice: ' + err.message + '\nMake sure Antigravity bridge server is running.', 'error');
            }
        }

        // ==================== CLAUDE API ====================
        async function callClaude(snapshot) {
            const key = localStorage.getItem('claude_ae_key') || '';
            if (!key) {
                log('Please enter and save your Claude API key.', 'error');
                return;
            }

            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) {
                log('Please enter a command or prompt.', 'error');
                return;
            }

            const select = document.getElementById('modelSelect');
            const model = (select && select.value) || 'claude-3-7-sonnet-20250219';
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing with Claude...';
            
            let seconds = 0;
            log(`Connecting to Anthropic Claude (${model})...`);
            const timer = setInterval(() => {
                seconds++;
                log(`Processing request (${seconds}s)...`);
            }, 1000);

            try {
                let userContent = [];
                let contextNote = '';
                if (snapshot) {
                    contextNote = `\n[Vision Context: Active Comp Resolution is ${snapshot.width}x${snapshot.height}. You can use addMaskToSelected(left, top, right, bottom, name) to apply subtract/add masks on the selected layer.]\n`;
                    userContent.push({
                        type: 'image',
                        source: {
                            type: 'base64',
                            media_type: 'image/png',
                            data: snapshot.base64
                        }
                    });
                }
                userContent.push({ type: 'text', text: prompt + contextNote });

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 2048,
                        system: SYSTEM_INSTRUCTION,
                        messages: [{ role: 'user', content: userContent }]
                    })
                });

                clearInterval(timer);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error ? errData.error.message : 'HTTP status ' + response.status);
                }

                const data = await response.json();
                let rawText = data.content?.[0]?.text || '';
                
                let generatedCode = rawText;
                const match = rawText.match(/```(?:javascript|jsx|extendscript)?\s*([\s\S]*?)```/i);
                if (match && match[1]) {
                    generatedCode = match[1].trim();
                } else {
                    generatedCode = rawText.replace(/```[a-z]*/gi, '').replace(/```/g, '').trim();
                }

                log(`Code generated (${seconds}s). Executing in After Effects...`);

                cs.evalScript('evalCustomScript(' + JSON.stringify(generatedCode) + ')', function(res) {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Execute with Claude';
                    log(res, res && res.indexOf('ERROR') === 0 ? 'error' : 'success');
                });

            } catch (err) {
                clearInterval(timer);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Execute with Claude';
                log('Claude Error: ' + err.message, 'error');
            }
        }

        // ==================== GEMINI API ====================
        async function callGemini(snapshot) {
            const key = localStorage.getItem('gemini_ae_key') || '';
            if (!key) {
                log('Please enter and save your Gemini API key.', 'error');
                return;
            }

            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) {
                log('Please enter a command or prompt.', 'error');
                return;
            }

            const select = document.getElementById('modelSelect');
            const model = (select && select.value) || 'gemini-3.8-flash';
            sendBtn.disabled = true;
            sendBtn.textContent = 'Processing with Gemini...';
            
            let seconds = 0;
            log(`Connecting to Gemini (${model})...`);
            const timer = setInterval(() => {
                seconds++;
                log(`Processing request (${seconds}s)...`);
            }, 1000);

            try {
                let contextNote = '';
                let parts = [];
                if (snapshot) {
                    contextNote = `\n[Vision Context: Active Comp Resolution is ${snapshot.width}x${snapshot.height}. Visually locate the requested target/text and generate ExtendScript using addMaskToSelected(left, top, right, bottom, name) or custom masks.]\n`;
                    parts.push({
                        inline_data: {
                            mime_type: 'image/png',
                            data: snapshot.base64
                        }
                    });
                }
                parts.push({ text: SYSTEM_INSTRUCTION + contextNote + "\n\nUser Request: " + prompt });

                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` + encodeURIComponent(key);
                const payload = {
                    contents: [{ role: 'user', parts: parts }]
                };

                if (model.includes('3.') || model.includes('2.5')) {
                    payload.generationConfig = { thinkingConfig: { thinkingBudget: 0 } };
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                clearInterval(timer);

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error ? errData.error.message : 'HTTP status ' + response.status);
                }

                const data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                
                let generatedCode = rawText;
                const match = rawText.match(/```(?:javascript|jsx|extendscript)?\s*([\s\S]*?)```/i);
                if (match && match[1]) {
                    generatedCode = match[1].trim();
                } else {
                    generatedCode = rawText.replace(/```[a-z]*/gi, '').replace(/```/g, '').trim();
                }

                log(`Code generated (${seconds}s). Executing in After Effects...`);

                cs.evalScript('evalCustomScript(' + JSON.stringify(generatedCode) + ')', function(res) {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Execute with Gemini';
                    log(res, res && res.indexOf('ERROR') === 0 ? 'error' : 'success');
                });

            } catch (err) {
                clearInterval(timer);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Execute with Gemini';
                log('Gemini Error: ' + err.message, 'error');
            }
        }

        function createTitle() {
            log('Creating sample title comp...');
            cs.evalScript('createDemoComp("AI MOTION TITLE")', function(res) {
                log(res, res && res.indexOf('ERROR') === 0 ? 'error' : 'success');
            });
        }

        function addWiggle() {
            log('Applying wiggle to selected layer...');
            cs.evalScript('addWiggleToSelected()', function(res) {
                log(res, res && res.indexOf('ERROR') === 0 ? 'error' : 'success');
            });
        }
    </script>
</body>
</html>
